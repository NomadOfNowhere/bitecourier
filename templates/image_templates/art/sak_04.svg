<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Sashimi Combo: salmon, tuna and yellowtail slices on shiso leaves on a wooden board</title>
  <defs>
    <g id="sak04-salmon">
      <rect x="-12" y="-25" width="28" height="56" rx="8" fill="#3B2412" opacity="0.12"/>
      <rect x="-14" y="-28" width="28" height="56" rx="8" fill="#F7955F"/>
      <g fill="none" stroke="#FDDCC6" stroke-width="2.2" stroke-linecap="round">
        <path d="M-9 -17 Q0 -12 9 -19"/>
        <path d="M-9 -2 Q0 3 9 -4"/>
        <path d="M-9 13 Q0 18 9 11"/>
      </g>
    </g>
    <g id="sak04-tuna">
      <rect x="-12" y="-25" width="28" height="56" rx="8" fill="#3B2412" opacity="0.12"/>
      <rect x="-14" y="-28" width="28" height="56" rx="8" fill="#C93848"/>
      <path d="M-7 -21 V21" stroke="#DE5A6A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
    <g id="sak04-yellowtail">
      <rect x="-12" y="-25" width="28" height="56" rx="8" fill="#3B2412" opacity="0.12"/>
      <rect x="-14" y="-28" width="28" height="56" rx="8" fill="#F5DFCD"/>
      <path d="M8 -24 Q13 0 8 24" fill="none" stroke="#E7A79A" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="sak04-shiso">
      <path d="M0 -50 C30 -30 30 28 0 50 C-30 28 -30 -30 0 -50 Z" fill="#5E9A3E"/>
      <path d="M0 -46 V46 M0 -20 L14 -32 M0 -20 L-14 -32 M0 4 L16 -8 M0 4 L-16 -8 M0 28 L13 18 M0 28 L-13 18" fill="none" stroke="#4A7F30" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Wooden board -->
  <rect x="30" y="60" width="272" height="136" rx="12" fill="#5A2A30" opacity="0.10"/>
  <rect x="24" y="52" width="272" height="136" rx="12" fill="#DDBB8C"/>
  <g fill="none" stroke="#C9A26E" stroke-width="1.2" opacity="0.7">
    <path d="M32 72 C90 66 150 78 210 70 S280 74 288 72"/>
    <path d="M32 100 C80 106 140 96 200 104 S270 98 288 102"/>
    <path d="M32 140 C100 134 160 146 220 138 S275 142 288 140"/>
    <path d="M32 172 C90 178 150 168 210 176 S280 170 288 174"/>
  </g>

  <!-- Shiso leaves -->
  <use href="#sak04-shiso" transform="translate(84 116) rotate(-38)"/>
  <use href="#sak04-shiso" transform="translate(158 120) rotate(38)"/>
  <use href="#sak04-shiso" transform="translate(232 116) rotate(-38)"/>

  <!-- Fish, each set fanned slightly -->
  <use href="#sak04-salmon" transform="translate(64 122) rotate(-16)"/>
  <use href="#sak04-salmon" transform="translate(80 120) rotate(-8)"/>
  <use href="#sak04-salmon" transform="translate(96 119) rotate(0)"/>
  <use href="#sak04-tuna" transform="translate(138 121) rotate(-12)"/>
  <use href="#sak04-tuna" transform="translate(154 120) rotate(-4)"/>
  <use href="#sak04-tuna" transform="translate(170 120) rotate(4)"/>
  <use href="#sak04-yellowtail" transform="translate(212 122) rotate(-16)"/>
  <use href="#sak04-yellowtail" transform="translate(228 120) rotate(-8)"/>
  <use href="#sak04-yellowtail" transform="translate(244 119) rotate(0)"/>

  <!-- Wasabi -->
  <path d="M266 164c-3-7 2-13 9-13 6 0 11 4 10 9 3 5-2 10-8 9-5 2-10 0-11-5z" fill="#9CBF4B"/>
</svg>
