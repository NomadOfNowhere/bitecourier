<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Veggie Burrito Bowl: cilantro rice, black beans, corn, pico de gallo, lettuce, guacamole and chips</title>
  <defs>
    <pattern id="taq03-rice" width="10" height="10" patternUnits="userSpaceOnUse">
      <ellipse cx="3" cy="3" rx="3" ry="1.3" fill="#FFFFFF" transform="rotate(25 3 3)"/>
      <ellipse cx="7.5" cy="7.5" rx="3" ry="1.3" fill="#E3D9C0" transform="rotate(-35 7.5 7.5)"/>
      <circle cx="8" cy="2.5" r="1.1" fill="#5E9A3E"/>
    </pattern>
    <pattern id="taq03-beans" width="14" height="12" patternUnits="userSpaceOnUse">
      <ellipse cx="4" cy="3.5" rx="4" ry="2.8" fill="#241619" transform="rotate(20 4 3.5)"/>
      <ellipse cx="3" cy="2.8" rx="1.4" ry="0.8" fill="#7A6570" transform="rotate(20 3 2.8)"/>
      <ellipse cx="10.5" cy="9" rx="4" ry="2.8" fill="#241619" transform="rotate(-30 10.5 9)"/>
      <ellipse cx="9.6" cy="8.2" rx="1.4" ry="0.8" fill="#7A6570" transform="rotate(-30 9.6 8.2)"/>
    </pattern>
    <pattern id="taq03-corn" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="4" height="5" rx="1.6" fill="#FBE594"/>
      <rect x="5" y="4" width="4" height="5" rx="1.6" fill="#E3B02E"/>
    </pattern>
    <pattern id="taq03-pico" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="5" height="5" rx="1.2" fill="#CF3A2A"/>
      <rect x="7" y="6.5" width="4.5" height="4.5" rx="1.2" fill="#DB4C3A"/>
      <rect x="7.5" y="1" width="3" height="3" rx="0.8" fill="#FFFFFF"/>
      <circle cx="3" cy="9" r="1.5" fill="#3F8A36"/>
    </pattern>
    <pattern id="taq03-lettuce" width="12" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q3 0 6 4 T12 4" fill="none" stroke="#6FA83F" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- Bowl -->
  <circle cx="167" cy="128" r="104" fill="#5A3A00" opacity="0.08"/>
  <circle cx="160" cy="120" r="104" fill="#FFFFFF" stroke="#EBD9A8" stroke-width="2"/>

  <!-- Five toppings, each a wedge of the bowl -->
  <path d="M160 120 L160 30 A90 90 0 0 1 245.6 92.2 Z" fill="#F4EFDF"/>
  <path d="M160 120 L160 30 A90 90 0 0 1 245.6 92.2 Z" fill="url(#taq03-rice)"/>
  <path d="M160 120 L245.6 92.2 A90 90 0 0 1 212.9 192.8 Z" fill="#3D2B30"/>
  <path d="M160 120 L245.6 92.2 A90 90 0 0 1 212.9 192.8 Z" fill="url(#taq03-beans)"/>
  <path d="M160 120 L212.9 192.8 A90 90 0 0 1 107.1 192.8 Z" fill="#F2C94C"/>
  <path d="M160 120 L212.9 192.8 A90 90 0 0 1 107.1 192.8 Z" fill="url(#taq03-corn)"/>
  <path d="M160 120 L107.1 192.8 A90 90 0 0 1 74.4 92.2 Z" fill="#F0907A"/>
  <path d="M160 120 L107.1 192.8 A90 90 0 0 1 74.4 92.2 Z" fill="url(#taq03-pico)"/>
  <path d="M160 120 L74.4 92.2 A90 90 0 0 1 160 30 Z" fill="#B5D777"/>
  <path d="M160 120 L74.4 92.2 A90 90 0 0 1 160 30 Z" fill="url(#taq03-lettuce)"/>

  <!-- Tortilla chips tucked behind the guacamole -->
  <g fill="#EDBE5C" stroke="#CF9B36" stroke-width="1.5" stroke-linejoin="round">
    <path d="M166 112 L214 78 L204 126 Z"/>
    <path d="M158 106 L176 58 L196 100 Z"/>
  </g>
  <g fill="#D9A441"><circle cx="198" cy="98" r="1.4"/><circle cx="178" cy="82" r="1.4"/><circle cx="186" cy="92" r="1.2"/></g>

  <!-- Guacamole -->
  <path d="M158 94c16-2 29 9 29 25 0 16-13 28-29 28-16 0-29-12-29-28 0-15 12-25 29-25z" fill="#A8C957" stroke="#86A63E" stroke-width="2"/>
  <path d="M144 112 Q152 104 162 108" fill="none" stroke="#C6DE86" stroke-width="3" stroke-linecap="round"/>
  <g fill="#D8402F"><rect x="162" y="120" width="4" height="4" rx="1"/><rect x="146" y="126" width="4" height="4" rx="1"/></g>
  <g fill="#FFFFFF"><rect x="154" y="132" width="3.5" height="3.5" rx="1"/><rect x="170" y="110" width="3.5" height="3.5" rx="1"/></g>
</svg>
