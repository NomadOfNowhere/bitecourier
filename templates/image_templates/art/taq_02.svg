<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Baja Fish Tacos: two tacos with crispy fish, purple cabbage and crema, with salsa and lime</title>
  <defs>
    <g id="taq02-fish">
      <rect x="-13" y="-7" width="26" height="14" rx="7" fill="#E9B04A" stroke="#C4872A" stroke-width="1.2"/>
      <path d="M-7 -1 Q-3 -5 1 -1 M2 3 Q6 -1 9 3" fill="none" stroke="#F6D58E" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="taq02-taco">
      <ellipse rx="38" ry="42" fill="#EBCB86" stroke="#D2A650" stroke-width="1.5"/>
      <g fill="#D8AE5E">
        <circle cx="-25" cy="-19" r="3"/><circle cx="26" cy="21" r="2.5"/><circle cx="24" cy="-25" r="2"/>
        <circle cx="-26" cy="21" r="2.5"/><circle cx="-31" cy="1" r="1.8"/><circle cx="31" cy="-3" r="1.8"/>
      </g>
      <!-- Purple cabbage -->
      <ellipse rx="21" ry="34" fill="#8E4B93"/>
      <g fill="none" stroke="#C99BD0" stroke-width="2" stroke-linecap="round">
        <path d="M-14 -22 Q-6 -27 2 -23"/><path d="M4 -30 Q10 -26 13 -19"/><path d="M-16 -4 Q-10 -9 -5 -4"/>
        <path d="M8 2 Q14 -2 17 6"/><path d="M-13 16 Q-6 12 -1 18"/><path d="M4 26 Q10 21 13 15"/>
      </g>
      <use href="#taq02-fish" transform="translate(-1 -18) rotate(25)"/>
      <use href="#taq02-fish" transform="translate(2 1) rotate(-20)"/>
      <use href="#taq02-fish" transform="translate(-2 19) rotate(18)"/>
      <!-- Crema -->
      <path d="M-12 -29 Q12 -22 -11 -11 T-9 8 T-8 29" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
      <g fill="#3F8A36">
        <circle cx="10" cy="-12" r="2"/><circle cx="-12" cy="8" r="2"/><circle cx="11" cy="12" r="2"/><circle cx="6" cy="-28" r="1.8"/>
      </g>
    </g>
    <g id="taq02-lime">
      <path d="M-16 0 A16 16 0 0 0 16 0 Z" fill="#CFE58A" stroke="#5E9A2E" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 1 V13 M0 1 L-9 10 M0 1 L9 10" fill="none" stroke="#EEF6C8" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Plate -->
  <circle cx="167" cy="128" r="106" fill="#5A3A00" opacity="0.08"/>
  <circle cx="160" cy="120" r="106" fill="#FFFFFF" stroke="#EBD9A8" stroke-width="2"/>
  <circle cx="160" cy="120" r="94" fill="none" stroke="#F3E8C6" stroke-width="2"/>

  <!-- Tacos -->
  <use href="#taq02-taco" transform="translate(118 112) rotate(-24)"/>
  <use href="#taq02-taco" transform="translate(198 136) rotate(18)"/>

  <!-- Salsa -->
  <circle cx="176" cy="52" r="18" fill="#FFFFFF" stroke="#E4D3A6" stroke-width="2"/>
  <circle cx="176" cy="52" r="13.5" fill="#C63D2B"/>
  <g fill="#E8715C"><circle cx="171" cy="48" r="2"/><circle cx="180" cy="56" r="2"/><circle cx="181" cy="47" r="1.6"/></g>
  <g fill="#3F8A36"><circle cx="174" cy="57" r="1.5"/><circle cx="178" cy="50" r="1.3"/></g>

  <!-- Lime -->
  <use href="#taq02-lime" transform="translate(136 192) rotate(165)"/>
</svg>
