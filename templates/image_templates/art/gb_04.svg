<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Quinoa Power Salad: quinoa on spinach with tomato, cucumber, chickpeas, feta and lemon</title>
  <defs>
    <pattern id="gb04-quinoa" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#F5EBD0"/>
      <circle cx="6" cy="5" r="1.5" fill="#D8C08C"/>
      <circle cx="3" cy="6.5" r="1.2" fill="#A44A3C"/>
    </pattern>
    <g id="gb04-spinach">
      <path d="M0 -26 C16 -20 18 4 0 26 C-18 4 -16 -20 0 -26 Z"/>
      <path d="M0 -22 V22" stroke="#7DB866" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="gb04-tomato">
      <circle r="11" fill="#D93C32"/>
      <circle r="8.5" fill="#F06A55"/>
      <g fill="#F7D29E">
        <ellipse cx="-3.5" cy="-2" rx="1.6" ry="1"/><ellipse cx="3.5" cy="-2" rx="1.6" ry="1"/><ellipse cx="0" cy="3.5" rx="1.6" ry="1"/>
      </g>
      <circle r="2" fill="#F59A80"/>
    </g>
    <g id="gb04-cucumber">
      <circle r="12" fill="#4F7F2C"/>
      <circle r="10" fill="#DDEBB4"/>
      <circle r="5.5" fill="#C9DC94"/>
      <g fill="#F2F6DC">
        <ellipse cx="0" cy="-3" rx="1.2" ry="2"/>
        <ellipse cx="2.6" cy="1.5" rx="1.2" ry="2" transform="rotate(120 2.6 1.5)"/>
        <ellipse cx="-2.6" cy="1.5" rx="1.2" ry="2" transform="rotate(-120 -2.6 1.5)"/>
      </g>
    </g>
    <g id="gb04-chickpea">
      <circle r="5.5" fill="#DDB46C" stroke="#C59A4F" stroke-width="0.8"/>
      <circle cx="-1.6" cy="-1.6" r="1.8" fill="#EFD39E"/>
    </g>
    <rect id="gb04-feta" x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="#FBF9F2" stroke="#E2DACA" stroke-width="1"/>
    <g id="gb04-lemon">
      <path d="M-20 0 A20 20 0 0 0 20 0 Z" fill="#F9DE57" stroke="#E7B820" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 1 V17 M0 1 L-12 13 M0 1 L12 13" fill="none" stroke="#FBEA9A" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Bowl with a bed of spinach -->
  <circle cx="167" cy="128" r="104" fill="#1E3A24" opacity="0.08"/>
  <circle cx="160" cy="120" r="104" fill="#FFFFFF" stroke="#D4E5D6" stroke-width="2"/>
  <circle cx="160" cy="120" r="90" fill="#2F6229"/>
  <use href="#gb04-spinach" fill="#3F7A35" transform="translate(222 120) rotate(90)"/>
  <use href="#gb04-spinach" fill="#4E9142" transform="translate(210.2 156.5) rotate(126)"/>
  <use href="#gb04-spinach" fill="#3F7A35" transform="translate(179.2 179) rotate(162)"/>
  <use href="#gb04-spinach" fill="#4E9142" transform="translate(140.8 179) rotate(198)"/>
  <use href="#gb04-spinach" fill="#3F7A35" transform="translate(109.8 156.5) rotate(234)"/>
  <use href="#gb04-spinach" fill="#4E9142" transform="translate(98 120) rotate(270)"/>
  <use href="#gb04-spinach" fill="#3F7A35" transform="translate(109.8 83.5) rotate(306)"/>
  <use href="#gb04-spinach" fill="#4E9142" transform="translate(140.8 61) rotate(342)"/>
  <use href="#gb04-spinach" fill="#3F7A35" transform="translate(179.2 61) rotate(18)"/>
  <use href="#gb04-spinach" fill="#4E9142" transform="translate(210.2 83.5) rotate(54)"/>

  <!-- Quinoa -->
  <circle cx="160" cy="120" r="52" fill="#E6D4AA"/>
  <circle cx="160" cy="120" r="52" fill="url(#gb04-quinoa)"/>

  <!-- Toppings -->
  <use href="#gb04-cucumber" transform="translate(174 94) rotate(20)"/>
  <use href="#gb04-cucumber" transform="translate(126 128)"/>
  <use href="#gb04-cucumber" transform="translate(186 140) rotate(60)"/>
  <use href="#gb04-tomato" transform="translate(142 98) rotate(15)"/>
  <use href="#gb04-tomato" transform="translate(190 116) rotate(-40)"/>
  <use href="#gb04-tomato" transform="translate(152 150) rotate(80)"/>
  <use href="#gb04-chickpea" transform="translate(158 116)"/>
  <use href="#gb04-chickpea" transform="translate(167 124)"/>
  <use href="#gb04-chickpea" transform="translate(152 127)"/>
  <use href="#gb04-chickpea" transform="translate(132 110)"/>
  <use href="#gb04-chickpea" transform="translate(170 154)"/>
  <use href="#gb04-chickpea" transform="translate(138 146)"/>
  <use href="#gb04-chickpea" transform="translate(196 98)"/>
  <use href="#gb04-feta" transform="translate(160 100) rotate(15)"/>
  <use href="#gb04-feta" transform="translate(176 132) rotate(-20)"/>
  <use href="#gb04-feta" transform="translate(140 132) rotate(35)"/>
  <use href="#gb04-feta" transform="translate(124 146) rotate(-10)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M150 80 A14 14 0 0 1 176 76" stroke="#97468A" stroke-width="4"/>
    <path d="M150 80 A14 14 0 0 1 176 76" stroke="#E6C6DF" stroke-width="1.3"/>
    <path d="M114 112 A12 12 0 0 1 120 92" stroke="#97468A" stroke-width="4"/>
    <path d="M114 112 A12 12 0 0 1 120 92" stroke="#E6C6DF" stroke-width="1.3"/>
  </g>

  <!-- Lemon wedge on the rim side -->
  <use href="#gb04-lemon" transform="translate(222 70) rotate(-130)"/>
</svg>
