<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Grilled Chicken Tacos: three open corn tortillas with grilled chicken, pico de gallo and lime</title>
  <defs>
    <g id="taq01-chicken">
      <rect x="-11" y="-6" width="22" height="12" rx="4.5" fill="#E7BC7C" stroke="#C08B48" stroke-width="1"/>
      <path d="M-5 -3.5 L-2 3.5 M2 -3.5 L5 3.5" stroke="#8A5A30" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- One open taco seen from above -->
    <g id="taq01-taco">
      <ellipse rx="35" ry="39" fill="#EBCB86" stroke="#D2A650" stroke-width="1.5"/>
      <g fill="#D8AE5E">
        <circle cx="-22" cy="-18" r="3"/><circle cx="23" cy="20" r="2.5"/><circle cx="21" cy="-23" r="2"/>
        <circle cx="-23" cy="19" r="2.5"/><circle cx="-28" cy="0" r="1.8"/><circle cx="28" cy="-2" r="1.8"/>
      </g>
      <ellipse rx="19" ry="31" fill="#B5D777"/>
      <use href="#taq01-chicken" transform="translate(-2 -17) rotate(20)"/>
      <use href="#taq01-chicken" transform="translate(3 -1) rotate(-25)"/>
      <use href="#taq01-chicken" transform="translate(-3 15) rotate(15)"/>
      <g fill="#D8402F">
        <rect x="6" y="-28" width="6" height="6" rx="1.5"/><rect x="-15" y="-9" width="6" height="6" rx="1.5"/>
        <rect x="9" y="8" width="6" height="6" rx="1.5"/><rect x="-8" y="23" width="6" height="6" rx="1.5"/>
      </g>
      <g fill="#FFFFFF">
        <rect x="-12" y="-28" width="4" height="4" rx="1"/><rect x="12" y="-11" width="4" height="4" rx="1"/>
        <rect x="-15" y="5" width="4" height="4" rx="1"/><rect x="5" y="23" width="4" height="4" rx="1"/>
      </g>
      <g fill="#3F8A36">
        <circle cx="0" cy="-28" r="2"/><circle cx="-11" cy="1" r="2"/><circle cx="13" cy="0" r="2"/>
        <circle cx="0" cy="28" r="2"/><circle cx="14" cy="19" r="1.8"/>
      </g>
    </g>
    <g id="taq01-lime">
      <path d="M-16 0 A16 16 0 0 0 16 0 Z" fill="#CFE58A" stroke="#5E9A2E" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 1 V13 M0 1 L-9 10 M0 1 L9 10" fill="none" stroke="#EEF6C8" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Plate -->
  <rect x="28" y="58" width="276" height="140" rx="22" fill="#5A3A00" opacity="0.08"/>
  <rect x="22" y="50" width="276" height="140" rx="22" fill="#FFFFFF"/>
  <rect x="30" y="58" width="260" height="124" rx="16" fill="none" stroke="#EBD9A8" stroke-width="1.5"/>

  <!-- Tacos -->
  <use href="#taq01-taco" transform="translate(70 120) rotate(-8)"/>
  <use href="#taq01-taco" transform="translate(144 120) rotate(6)"/>
  <use href="#taq01-taco" transform="translate(218 120) rotate(-5)"/>

  <!-- Lime wedges -->
  <use href="#taq01-lime" transform="translate(270 100) rotate(-75)"/>
  <use href="#taq01-lime" transform="translate(268 146) rotate(-110)"/>
</svg>
