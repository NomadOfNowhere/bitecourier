<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Clean Protein Bowl: grilled chicken over brown rice with broccoli, egg and avocado</title>
  <defs>
    <pattern id="gb03-rice" width="10" height="10" patternUnits="userSpaceOnUse">
      <ellipse cx="3" cy="3" rx="3" ry="1.3" fill="#F2E9D6" transform="rotate(25 3 3)"/>
      <ellipse cx="7.5" cy="7.5" rx="3" ry="1.3" fill="#C8AF84" transform="rotate(-35 7.5 7.5)"/>
    </pattern>
    <g id="gb03-chicken">
      <rect x="-13" y="-30" width="26" height="60" rx="9" fill="#C99A5E"/>
      <rect x="-11.5" y="-28.5" width="23" height="57" rx="8" fill="#EAC690"/>
      <g stroke="#8A5A30" stroke-width="3" stroke-linecap="round" opacity="0.85">
        <path d="M-7 -15 L7 -23"/><path d="M-7 3 L7 -5"/><path d="M-7 21 L7 13"/>
      </g>
    </g>
    <g id="gb03-broccoli">
      <circle r="16" fill="#3D7432"/>
      <g fill="#559A43"><circle cx="-7" cy="-6" r="7"/><circle cx="6" cy="-7" r="7"/><circle cx="8" cy="5" r="7"/><circle cx="-6" cy="7" r="7"/><circle r="7"/></g>
      <g fill="#7CBB5F"><circle cx="-8" cy="-8" r="2.5"/><circle cx="5" cy="-9" r="2.5"/><circle cx="7" cy="3" r="2.5"/><circle cx="-7" cy="5" r="2.5"/><circle cx="-1" cy="-2" r="2.5"/></g>
    </g>
    <g id="gb03-egg">
      <ellipse rx="20" ry="15" fill="#FFFFFF" stroke="#E6DECC" stroke-width="1.5"/>
      <circle cx="1" cy="1" r="8.5" fill="#F0AA2E"/>
      <circle cx="-1.5" cy="-1.5" r="3" fill="#F7C760"/>
    </g>
    <path id="gb03-avocado" d="M-24 0 A24 24 0 0 0 24 0 A26 14 0 0 1 -24 0 Z" fill="#BCD87F" stroke="#4C6E2C" stroke-width="2.5" stroke-linejoin="round"/>
  </defs>

  <!-- Bowl and brown rice -->
  <circle cx="167" cy="128" r="104" fill="#1E3A24" opacity="0.08"/>
  <circle cx="160" cy="120" r="104" fill="#FFFFFF" stroke="#D4E5D6" stroke-width="2"/>
  <circle cx="160" cy="120" r="90" fill="#DCC9A3"/>
  <circle cx="160" cy="120" r="90" fill="url(#gb03-rice)"/>

  <!-- Grilled chicken, fanned across the top -->
  <use href="#gb03-chicken" transform="translate(118 88) rotate(-14)"/>
  <use href="#gb03-chicken" transform="translate(139 82) rotate(-7)"/>
  <use href="#gb03-chicken" transform="translate(160 80) rotate(0)"/>
  <use href="#gb03-chicken" transform="translate(181 82) rotate(7)"/>
  <use href="#gb03-chicken" transform="translate(202 88) rotate(14)"/>

  <!-- Broccoli, bottom left -->
  <use href="#gb03-broccoli" transform="translate(110 140)"/>
  <use href="#gb03-broccoli" transform="translate(104 168) rotate(40)"/>
  <use href="#gb03-broccoli" transform="translate(130 160) rotate(-30)"/>

  <!-- Avocado, bottom center -->
  <use href="#gb03-avocado" transform="translate(150 170) rotate(-18)"/>
  <use href="#gb03-avocado" transform="translate(162 176) rotate(-4)"/>
  <use href="#gb03-avocado" transform="translate(174 180) rotate(10)"/>

  <!-- Egg halves, right -->
  <use href="#gb03-egg" transform="translate(208 140) rotate(-20)"/>
  <use href="#gb03-egg" transform="translate(198 166) rotate(15)"/>

  <!-- Yogurt drizzle and sesame on the chicken -->
  <path d="M106 96 C120 76 132 108 146 86 S172 70 184 92 S206 104 214 84" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <g fill="#F7F0DE">
    <ellipse cx="128" cy="70" rx="1.8" ry="1" transform="rotate(30 128 70)"/>
    <ellipse cx="152" cy="98" rx="1.8" ry="1" transform="rotate(-20 152 98)"/>
    <ellipse cx="170" cy="66" rx="1.8" ry="1" transform="rotate(60 170 66)"/>
    <ellipse cx="190" cy="102" rx="1.8" ry="1" transform="rotate(10 190 102)"/>
    <ellipse cx="200" cy="72" rx="1.8" ry="1" transform="rotate(-50 200 72)"/>
    <ellipse cx="140" cy="62" rx="1.8" ry="1" transform="rotate(15 140 62)"/>
  </g>
</svg>
