<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>California Rolls Light: six uramaki pieces with wasabi and pickled ginger</title>
  <defs>
    <pattern id="sak01-sesame" width="9" height="9" patternUnits="userSpaceOnUse">
      <ellipse cx="2.5" cy="3" rx="1.4" ry="0.75" fill="#2F2A27" transform="rotate(30 2.5 3)"/>
      <ellipse cx="6.8" cy="6.8" rx="1.4" ry="0.75" fill="#D8C79C" transform="rotate(-25 6.8 6.8)"/>
    </pattern>
    <!-- One roll piece seen from above: rice + sesame, nori ring, crab / avocado / cucumber -->
    <g id="sak01-maki">
      <circle r="27" fill="#FBF9F3" stroke="#E7E0D2" stroke-width="1.5"/>
      <circle r="26" fill="url(#sak01-sesame)"/>
      <circle r="16.5" fill="#2E3A2E"/>
      <circle r="14" fill="#F3ECDD"/>
      <path d="M0 0 L12 0 A12 12 0 0 1 -6 10.39 Z" fill="#EF7B5E"/>
      <path d="M0 0 L-6 10.39 A12 12 0 0 1 -6 -10.39 Z" fill="#95BC57"/>
      <path d="M0 0 L-6 -10.39 A12 12 0 0 1 12 0 Z" fill="#D6EAB1"/>
    </g>
  </defs>

  <!-- Plate -->
  <rect x="28" y="58" width="276" height="140" rx="22" fill="#5A2A30" opacity="0.08"/>
  <rect x="22" y="50" width="276" height="140" rx="22" fill="#FFFFFF"/>
  <rect x="30" y="58" width="260" height="124" rx="16" fill="none" stroke="#F1DDE0" stroke-width="1.5"/>

  <!-- Rolls -->
  <use href="#sak01-maki" transform="translate(68 92) rotate(10)"/>
  <use href="#sak01-maki" transform="translate(124 92) rotate(130)"/>
  <use href="#sak01-maki" transform="translate(180 92) rotate(250)"/>
  <use href="#sak01-maki" transform="translate(68 148) rotate(200)"/>
  <use href="#sak01-maki" transform="translate(124 148) rotate(-40)"/>
  <use href="#sak01-maki" transform="translate(180 148) rotate(80)"/>

  <!-- Wasabi -->
  <path d="M232 96c-4-9 3-17 12-17 8 0 14 5 13 12 4 6-2 13-10 12-6 3-14 0-15-7z" fill="#9CBF4B"/>
  <path d="M238 87c3-3 8-3 11-1" fill="none" stroke="#C2DB7E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pickled ginger -->
  <g fill="#F7CFC8" stroke="#EAA79D" stroke-width="1.2">
    <ellipse cx="240" cy="150" rx="17" ry="10" transform="rotate(-20 240 150)"/>
    <ellipse cx="258" cy="144" rx="17" ry="10" transform="rotate(15 258 144)"/>
    <ellipse cx="251" cy="160" rx="17" ry="10" transform="rotate(-5 251 160)"/>
  </g>
</svg>
