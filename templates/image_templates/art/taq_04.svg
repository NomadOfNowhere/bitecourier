<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <title>Street Corn Salad: charred corn with cotija, crema, chili and lime in a clay bowl</title>
  <defs>
    <pattern id="taq04-corn" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="4.5" height="5.5" rx="1.8" fill="#FBE594"/>
      <rect x="5.5" y="4.5" width="4.5" height="5.5" rx="1.8" fill="#E7B633"/>
      <rect x="5.8" y="0" width="4" height="3.6" rx="1.6" fill="#F7D666"/>
    </pattern>
    <g id="taq04-cilantro">
      <circle cx="-3" cy="0" r="3.4"/><circle cx="3" cy="0" r="3.4"/><circle cx="0" cy="-4" r="3.4"/>
    </g>
  </defs>

  <!-- Clay bowl -->
  <circle cx="167" cy="128" r="104" fill="#5A3A00" opacity="0.10"/>
  <circle cx="160" cy="120" r="104" fill="#D0784A" stroke="#B8623A" stroke-width="2"/>
  <circle cx="160" cy="120" r="96" fill="none" stroke="#E29A6E" stroke-width="2"/>

  <!-- Corn -->
  <circle cx="160" cy="120" r="88" fill="#F2C94C"/>
  <circle cx="160" cy="120" r="88" fill="url(#taq04-corn)"/>

  <!-- Charred kernels -->
  <g fill="#8A5A22">
    <rect x="118" y="78" width="4.5" height="5.5" rx="1.8"/><rect x="196" y="92" width="4.5" height="5.5" rx="1.8"/>
    <rect x="142" y="162" width="4.5" height="5.5" rx="1.8"/><rect x="208" y="150" width="4.5" height="5.5" rx="1.8"/>
    <rect x="100" y="130" width="4.5" height="5.5" rx="1.8"/><rect x="172" y="64" width="4.5" height="5.5" rx="1.8"/>
    <rect x="176" y="182" width="4.5" height="5.5" rx="1.8"/><rect x="226" y="118" width="4.5" height="5.5" rx="1.8"/>
  </g>

  <!-- Crema -->
  <path d="M96 104 C116 84 130 126 150 102 S186 84 200 110 S220 134 228 108" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M104 150 C122 132 138 168 158 148 S190 132 206 152" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Cotija -->
  <g fill="#FFFFFF" stroke="#E9DFC8" stroke-width="0.8">
    <path d="M134 86 l7 -2 4 5 -3 6 -7 0 -3 -5 z"/><path d="M176 122 l6 -3 5 4 -2 6 -7 1 -3 -4 z"/>
    <path d="M122 122 l6 -1 3 5 -3 5 -6 -1 -2 -4 z"/><path d="M196 164 l6 -2 4 4 -2 6 -6 0 -3 -4 z"/>
    <path d="M150 176 l5 -3 5 3 -1 6 -6 1 -3 -3 z"/><path d="M204 76 l6 -1 3 5 -3 4 -6 -1 -1 -4 z"/>
    <path d="M152 126 l5 -2 4 4 -2 5 -6 0 -2 -4 z"/>
  </g>

  <!-- Chili powder -->
  <g fill="#C4321F">
    <circle cx="146" cy="96" r="1.6"/><circle cx="154" cy="92" r="1.3"/><circle cx="162" cy="100" r="1.6"/><circle cx="170" cy="94" r="1.2"/>
    <circle cx="186" cy="140" r="1.6"/><circle cx="194" cy="134" r="1.3"/><circle cx="178" cy="148" r="1.4"/>
    <circle cx="126" cy="150" r="1.6"/><circle cx="134" cy="142" r="1.3"/><circle cx="118" cy="106" r="1.4"/>
    <circle cx="210" cy="122" r="1.5"/><circle cx="164" cy="166" r="1.5"/><circle cx="140" cy="112" r="1.2"/>
  </g>

  <!-- Cilantro -->
  <use href="#taq04-cilantro" fill="#3F8A36" transform="translate(190 106) rotate(20)"/>
  <use href="#taq04-cilantro" fill="#4F9A42" transform="translate(138 134) rotate(-40)"/>
  <use href="#taq04-cilantro" fill="#3F8A36" transform="translate(170 150) rotate(150)"/>
  <use href="#taq04-cilantro" fill="#4F9A42" transform="translate(152 74) rotate(80)"/>

  <!-- Lime wedge resting on the rim -->
  <g transform="translate(226 62) rotate(-135)">
    <path d="M-20 0 A20 20 0 0 0 20 0 Z" fill="#CFE58A" stroke="#5E9A2E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 1 V16 M0 1 L-11 12 M0 1 L11 12" fill="none" stroke="#EEF6C8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
